{% extends "base.html" %}
{% block title %}Sign up — {{ hospital_name }}{% endblock %}
{% block content %}
  <a class="back-link" href="/">&larr; Choose a different hospital</a>
  <h1>{{ hospital_name }} sign up</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form class="card-form" action="/{{ hospital }}/signup" method="post">
    <label>
      I am a
      <select name="role" required>
        <option value="staff">Staff member</option>
        <option value="patient">Patient</option>
      </select>
    </label>
    <label>
      Full name
      <input type="text" name="full_name" required autofocus>
    </label>
    <label>
      Email
      <input type="email" name="email" required>
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="8">
    </label>
    <button type="submit">Create account</button>
  </form>

  <p class="subtitle">Already have an account? <a href="/{{ hospital }}/login">Log in</a>.</p>
{% endblock %}
