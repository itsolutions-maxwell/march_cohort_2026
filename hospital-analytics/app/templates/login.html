{% extends "base.html" %}
{% block title %}Log in — {{ hospital_name }}{% endblock %}
{% block content %}
  <a class="back-link" href="/">&larr; Choose a different hospital</a>
  <h1>{{ hospital_name }} login</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form class="card-form" action="/{{ hospital }}/login" method="post">
    <label>
      I am a
      <select name="role" required>
        <option value="staff">Staff member</option>
        <option value="patient">Patient</option>
      </select>
    </label>
    <label>
      Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>

  <p class="subtitle">New here? <a href="/{{ hospital }}/signup">Create an account</a>.</p>
{% endblock %}
